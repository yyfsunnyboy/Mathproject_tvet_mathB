{% extends "base.html" %}
{% block title %}我的錯題本{% endblock %}
{% block styles %}
<script>
window.MathJax = window.MathJax || {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    svg: { fontCache: 'global' }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.notebook-shell{max-width:920px;margin:2rem auto}.notebook-heading{color:#1f5134;font-weight:700}.notebook-empty{padding:4rem 1rem;text-align:center;color:#6c757d}.notebook-empty i{color:#78a98a;font-size:2.4rem;display:block;margin-bottom:.8rem}.notebook-node{border:1px solid #dbe9df;border-radius:.6rem;background:#fff;margin-bottom:.55rem;overflow:hidden}.notebook-node summary{list-style:none;cursor:pointer;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem}.notebook-node summary::-webkit-details-marker{display:none}.notebook-node summary::before{content:'›';font-size:1.45rem;color:#4e8a62;transition:transform .15s}.notebook-node[open]>summary::before{transform:rotate(90deg)}.node-name{flex:1;font-weight:600}.node-count{color:#39754d;white-space:nowrap}.notebook-children{padding:0 .7rem .7rem 1.4rem}.level-2{border-color:#e7eee9;margin-bottom:.4rem}.level-3{border-color:transparent;box-shadow:inset 3px 0 #dcefe1}.mistake-list{padding:.75rem .3rem .25rem}.mistake-card{border:1px solid #e5e9e6;border-radius:.5rem;padding:1rem;margin-bottom:.7rem}.mistake-meta{color:#6c757d;font-size:.9rem}.mistake-question{margin:.8rem 0;line-height:1.75}.mistake-choices{margin:.5rem 0 .8rem 1.2rem;padding:0}.mistake-choices li{margin-bottom:.25rem}.mistake-answer{background:#fff8e6;border-left:3px solid #eabf54;padding:.55rem .7rem;margin:.7rem 0;white-space:pre-wrap}.mistake-note{color:#6c757d;font-size:.9rem;white-space:pre-wrap}
</style>
{% endblock %}
{% block content %}
<main class="container notebook-shell"><h2 class="notebook-heading">📝 我的錯題本</h2><p class="text-muted mb-4">做錯的題目會自動整理在這裡；答對重練題後，該題就會完成複習。</p><span class="visually-hidden">筆記與心得</span><div id="mistake-notebook-loading" class="text-center text-muted py-4">載入中…</div><div id="mistake-notebook-tree"></div><div id="mistake-notebook-empty" class="notebook-empty" hidden><i class="bi bi-check2-circle"></i><div class="h5">目前沒有需要複習的錯題</div><div>做錯的題目會自動整理到這裡。</div></div></main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/math_display_normalizer.js') }}?v=slash-frac-1"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{const tree=document.getElementById('mistake-notebook-tree'),loading=document.getElementById('mistake-notebook-loading'),empty=document.getElementById('mistake-notebook-empty');function math(element,attempt=0){if(!element)return;if(window.MathDisplayNormalizer)window.MathDisplayNormalizer.normalizeElement(element);const typeset=()=>{if(window.MathJax&&typeof window.MathJax.typesetClear==='function')window.MathJax.typesetClear([element]);return window.MathJax.typesetPromise([element]).catch(err=>console.error('MathJax typeset failed:',err))};if(window.MathJax&&typeof window.MathJax.typesetPromise==='function')return typeset();if(window.MathJax&&window.MathJax.startup)return window.MathJax.startup.promise.then(typeset);if(attempt<100)window.setTimeout(()=>math(element,attempt+1),50)}function list(entries){const out=document.createElement('div');out.className='mistake-list';entries.forEach(entry=>{const q=entry.question||{},card=document.createElement('article');card.className='mistake-card practice-math-surface';const time=document.createElement('div');time.className='mistake-meta';time.textContent=entry.created_at;const stem=document.createElement('div');stem.className='mistake-question';stem.innerHTML=q.question_text||q.new_question_text||q.display_question||entry.question_text||'舊資料未保存題幹。';card.append(time,stem);const choices=q.choices_display||q.choices;if(Array.isArray(choices)&&choices.length){const ul=document.createElement('ol');ul.className='mistake-choices';choices.forEach(choice=>{const li=document.createElement('li');li.innerHTML=typeof choice==='object'?(choice.text||choice.value||''):choice;ul.append(li)});card.append(ul)}if(entry.student_wrong_answer_display){const answer=document.createElement('div');answer.className='mistake-answer';answer.textContent=`當時作答：${entry.student_wrong_answer_display}`;card.append(answer)}if(entry.legacy_note){const note=document.createElement('div');note.className='mistake-note';note.textContent=entry.legacy_note;card.append(note)}const review=document.createElement('a');review.className='btn btn-success btn-sm mt-2';review.href=entry.review_url;review.textContent='重新練習';card.append(review);out.append(card)});return out}const nextChild={volumes:'chapters',chapters:'sections',sections:'skills',skills:'mistakes'};function node(item,level,childName){const details=document.createElement('details');details.className=`notebook-node level-${level}`;const summary=document.createElement('summary'),name=document.createElement('span'),count=document.createElement('span');name.className='node-name';name.textContent=item.name;count.className='node-count';count.textContent=`${item.count} 題`;summary.append(name,count);details.append(summary);const children=document.createElement('div');children.className='notebook-children';details.append(children);if(childName==='mistakes'){let loaded=false;details.addEventListener('toggle',async()=>{if(!details.open||loaded)return;loaded=true;children.textContent='載入錯題…';const response=await fetch(`/api/mistake-notebook/entries?key=${encodeURIComponent(item.key)}`),data=await response.json();children.replaceChildren(list(data.entries||[]));math(children)})}else{(item[childName]||[]).forEach(child=>children.append(node(child,level+1,nextChild[childName])))}return details}try{const response=await fetch('/api/mistake-notebook/tree'),data=await response.json();loading.hidden=true;if(!data.curricula||!data.curricula.length){empty.hidden=false;return}data.curricula.forEach(curriculum=>tree.append(node(curriculum,0,'volumes')))}catch(error){loading.textContent='載入失敗，請稍後再試。'}});
</script>
{% endblock %}
