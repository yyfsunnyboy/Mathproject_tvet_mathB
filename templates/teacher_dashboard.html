<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>教師儀表板 - 自適應性教學系統</title>
    <style>
        /* ── Base Reset ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont,
                         "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: #f7f6f2;
            color: #2f3a32;
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.65;
        }

        /* ── Design Tokens ── */
        :root {
            --paper-bg:      #f7f6f2;
            --paper-soft:    #fbfaf7;
            --card-bg:       #ffffff;
            --card-warm:     #fcfbf8;

            --ink:           #2f3a32;
            --ink-soft:      #4a544d;
            --muted:         #7b857d;

            --green-main:    #6b8f71;
            --green-deep:    #55735c;
            --green-soft:    #dfe8dc;
            --green-pale:    #eef4ea;
            --green-muted:   rgba(107,143,113,0.13);
            --green-ring:    rgba(107,143,113,0.24);

            --sand:          #ede6d9;
            --sand-soft:     #f6f1e8;

            --border:        #dde5d8;
            --border-soft:   #edf1e8;

            --ok:            #4a7c59;
            --ok-bg:         #edf6f0;
            --ok-border:     #b8d9c3;

            --warn-bg:       #fff4df;
            --warn-text:     #8a5a1f;
            --warn-border:   #e0c87a;

            --danger-bg:     #fdeeee;
            --danger-text:   #9b3a36;

            --shadow-soft:   0 8px 28px rgba(68,83,70,0.08);
            --shadow-card:   0 2px 12px rgba(68,83,70,0.07);
            --shadow-xs:     0 1px 4px rgba(68,83,70,0.06);

            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 20px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --dur: 0.16s;
        }

        /* ── Dashboard Shell ── */
        .dashboard-shell {
            max-width: 1380px;
            margin: 24px auto;
            padding: 0 22px 40px;
        }

        /* ── Welcome Banner ── */
        .welcome-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-left: 4px solid var(--green-main);
            border-radius: var(--r-lg);
            padding: 20px 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-xs);
            position: relative;
            overflow: hidden;
        }
        .welcome-banner::after {
            content: "📗";
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 52px;
            opacity: 0.07;
            pointer-events: none;
            user-select: none;
        }
        .welcome-banner h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }
        .welcome-banner p {
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.65;
            max-width: 680px;
        }

        /* ── Two-Column Workbench ── */
        .dashboard-workbench {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
            gap: 20px;
            align-items: start;
        }
        .dashboard-main-column,
        .dashboard-side-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 0;
        }

        /* ── Card ── */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-card);
            padding: 0;
            overflow: hidden;
        }
        .card-head {
            padding: 16px 20px 14px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .card-head h3 {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.01em;
        }
        .card-body {
            padding: 18px 20px;
        }

        /* ── Overview Stats ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .stat-box {
            background: var(--card-warm);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 16px 12px 14px;
            text-align: center;
            transition: background var(--dur) var(--ease),
                        border-color var(--dur) var(--ease),
                        box-shadow var(--dur) var(--ease);
        }
        .stat-box:hover {
            background: var(--green-pale);
            border-color: var(--green-soft);
            box-shadow: var(--shadow-card);
        }
        .stat-icon {
            font-size: 22px;
            margin-bottom: 6px;
            opacity: 0.72;
            line-height: 1;
        }
        .stat-number {
            font-size: 1.75em;
            font-weight: 700;
            color: var(--green-main);
            line-height: 1.15;
        }
        .stat-label {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* ── Class Management ── */
        .btn-create-class {
            background: var(--green-main);
            color: #fff;
            border: 1px solid var(--green-deep);
            border-radius: var(--r-md);
            padding: 7px 15px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(107,143,113,0.22);
            transition: background var(--dur) var(--ease);
            font-family: inherit;
        }
        .btn-create-class:hover { background: var(--green-deep); }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        /* 動態生成的班級卡 */
        .class-grid .stat-box {
            text-align: left;
            position: relative;
            padding: 14px 16px;
            background: var(--card-warm);
        }
        .class-grid .stat-box:hover {
            background: var(--green-pale);
            border-color: var(--green-soft);
        }
        .empty-state {
            color: var(--muted);
            font-size: 14px;
            padding: 24px 0;
            text-align: center;
            width: 100%;
        }

        /* ── Management Toolbox (right sidebar) ── */
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .tool-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 10px;
            background: var(--card-warm);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            text-decoration: none;
            cursor: pointer;
            min-height: 94px;
            transition: background var(--dur) var(--ease),
                        border-color var(--dur) var(--ease),
                        box-shadow var(--dur) var(--ease),
                        transform var(--dur) var(--ease);
        }
        .tool-card:hover {
            background: var(--green-pale);
            border-color: var(--green-main);
            box-shadow: var(--shadow-card);
            transform: translateY(-2px);
        }
        .tool-icon-wrap {
            width: 38px;
            height: 38px;
            background: var(--green-pale);
            border: 1px solid var(--green-soft);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
            transition: background var(--dur) var(--ease);
        }
        .tool-card:hover .tool-icon-wrap {
            background: var(--green-soft);
        }
        .tool-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink-soft);
            text-align: center;
            line-height: 1.35;
        }

        /* ── Modals ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(47,58,50,0.42);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
            z-index: 9999;
        }
        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: 0 16px 40px rgba(47,58,50,0.18);
            padding: 28px 30px 26px;
            width: min(520px, calc(100vw - 40px));
            max-height: 80vh;
            overflow-y: auto;
            animation: modalFadeIn 0.2s var(--ease) both;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .modal-box h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 18px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { margin-bottom: 0; }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.4em;
            color: var(--muted);
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
            transition: color var(--dur) var(--ease);
            font-family: inherit;
        }
        .modal-close-btn:hover { color: var(--ink); background: var(--border-soft); }

        .modal-section {
            background: var(--paper-soft);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-md);
            padding: 16px 18px;
            margin-bottom: 20px;
        }
        .modal-section h4 {
            font-size: 13.5px;
            color: var(--ink-soft);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .modal-section .divider {
            border-top: 1px dashed var(--border);
            padding-top: 14px;
            margin-top: 14px;
        }
        .modal-section .divider h4 {
            font-size: 12.5px;
            color: var(--muted);
        }

        /* Modal inputs */
        .modal-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            font-size: 14px;
            color: var(--ink);
            background: var(--card-bg);
            font-family: inherit;
            transition: border-color var(--dur) var(--ease),
                        box-shadow var(--dur) var(--ease);
        }
        .modal-input:focus {
            outline: none;
            border-color: var(--green-main);
            box-shadow: 0 0 0 3px var(--green-ring);
        }
        .modal-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 0;
        }
        .modal-input-row .modal-input { flex: 1; }

        /* Modal buttons */
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }
        .btn-modal-ok {
            background: var(--green-main);
            color: #fff;
            border: 1px solid var(--green-deep);
            border-radius: var(--r-md);
            padding: 9px 22px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(107,143,113,0.22);
            transition: background var(--dur) var(--ease);
            font-family: inherit;
        }
        .btn-modal-ok:hover { background: var(--green-deep); }
        .btn-modal-cancel {
            background: var(--paper-soft);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 9px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background var(--dur) var(--ease),
                        color var(--dur) var(--ease);
            font-family: inherit;
        }
        .btn-modal-cancel:hover { background: var(--sand-soft); color: var(--ink); }
        .btn-modal-add {
            background: var(--ok);
            color: #fff;
            border: 1px solid #3a6448;
            border-radius: var(--r-sm);
            padding: 8px 14px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: background var(--dur) var(--ease);
        }
        .btn-modal-add:hover { background: #3a6448; }
        .btn-modal-upload {
            background: var(--green-pale);
            color: var(--green-deep);
            border: 1px solid var(--green-soft);
            border-radius: var(--r-sm);
            padding: 8px 14px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: background var(--dur) var(--ease);
        }
        .btn-modal-upload:hover { background: var(--green-muted); border-color: var(--green-main); }

        /* Student table */
        .student-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        .student-table thead tr {
            background: var(--green-pale);
        }
        .student-table th {
            padding: 9px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--ink-soft);
            font-size: 12.5px;
        }
        .student-table td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border-soft);
            color: var(--ink);
        }
        .student-table tbody tr:hover td { background: var(--paper-soft); }

        /* RAG modal specific */
        .rag-label {
            display: block;
            margin-bottom: 5px;
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 500;
        }

        /* Scrollbars */
        * { scrollbar-width: thin; scrollbar-color: #c0d4bc transparent; }
        *::-webkit-scrollbar { width: 4px; height: 4px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: #c0d4bc; border-radius: 99px; }

        /* Responsive */
        @media (max-width: 960px) {
            .dashboard-workbench {
                grid-template-columns: 1fr;
            }
            .tool-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 640px) {
            .tool-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-grid { grid-template-columns: 1fr 1fr 1fr; }
            .dashboard-shell { padding: 0 14px 32px; }
        }
    </style>
</head>

<body>
    {% include '_admin_navbar.html' %}

    <div class="dashboard-shell">

        <!-- Welcome Banner -->
        <section class="welcome-banner">
            <h2>歡迎回來！</h2>
            <p>這是您的教學管理中心。您可以在此管理班級、查閱學生學習歷程、維護課程與技能資料庫。</p>
        </section>

        <div class="dashboard-workbench">

            <!-- ── 左欄：概覽 + 班級管理 ── -->
            <main class="dashboard-main-column">

                <!-- 快速概覽 -->
                <section class="card overview-card">
                    <div class="card-head">
                        <h3>快速概覽</h3>
                    </div>
                    <div class="card-body">
                        <div class="stat-grid">
                            <div class="stat-box">
                                <div class="stat-icon">🏫</div>
                                <div class="stat-number">0</div>
                                <div class="stat-label">班級數</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-icon">👨‍🎓</div>
                                <div class="stat-number">0</div>
                                <div class="stat-label">學生總數</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-icon">📝</div>
                                <div class="stat-number">0</div>
                                <div class="stat-label">待批改作業</div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 班級管理 -->
                <section class="card class-card">
                    <div class="card-head">
                        <h3>班級管理</h3>
                        <button onclick="openCreateClassModal()" class="btn-create-class">
                            + 建立新班級
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="classList" class="class-grid">
                            <p class="empty-state">載入中...</p>
                        </div>
                    </div>
                </section>

            </main>

            <!-- ── 右欄：教師工具箱 ── -->
            <aside class="dashboard-side-column">
                <section class="card management-card">
                    <div class="card-head">
                        <h3>教師工具箱</h3>
                    </div>
                    <div class="card-body">
                        <div class="tool-grid">
                            <a href="{{ url_for('teacher_analysis') }}" class="tool-card">
                                <div class="tool-icon-wrap">📊</div>
                                <div class="tool-label">學生分析報告</div>
                            </a>
                            <a href="{{ url_for('core.admin_curriculum') }}" class="tool-card">
                                <div class="tool-icon-wrap">📚</div>
                                <div class="tool-label">課程分類管理</div>
                            </a>
                            <a href="{{ url_for('core.admin_skills') }}" class="tool-card">
                                <div class="tool-icon-wrap">⚙️</div>
                                <div class="tool-label">單元管理</div>
                            </a>
                            <a href="{{ url_for('core.admin_prerequisites') }}" class="tool-card">
                                <div class="tool-icon-wrap">🔗</div>
                                <div class="tool-label">技能關聯</div>
                            </a>
                            <a href="{{ url_for('core.admin_examples') }}" class="tool-card">
                                <div class="tool-icon-wrap">📖</div>
                                <div class="tool-label">例題管理</div>
                            </a>
                            <a href="{{ url_for('core.admin_textbook_importer') }}" class="tool-card">
                                <div class="tool-icon-wrap">🤖</div>
                                <div class="tool-label">AI 教材匯入</div>
                            </a>
                            <a href="{{ url_for('core.db_maintenance') }}" class="tool-card">
                                <div class="tool-icon-wrap">🗃️</div>
                                <div class="tool-label">資料庫管理</div>
                            </a>
                            <a href="{{ url_for('core.ai_prompt_settings_page') }}" class="tool-card">
                                <div class="tool-icon-wrap">✨</div>
                                <div class="tool-label">AI 設定</div>
                            </a>
                        </div>
                    </div>
                </section>
            </aside>

        </div><!-- /.dashboard-workbench -->
    </div><!-- /.dashboard-shell -->

    <!-- 管理學生 Modal -->
    <div id="studentModal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="width:min(600px,calc(100vw - 40px));">
            <div class="modal-header">
                <h3 id="studentModalTitle">管理學生</h3>
                <button onclick="closeStudentModal()" class="modal-close-btn">&times;</button>
            </div>

            <div class="modal-section">
                <h4>新增學生</h4>
                <div class="modal-input-row" style="margin-bottom:12px;">
                    <input type="text" id="newStudentUsername" placeholder="帳號" class="modal-input">
                    <input type="text" id="newStudentPassword" placeholder="密碼" class="modal-input">
                    <button onclick="addStudent()" class="btn-modal-add">新增</button>
                </div>

                <div class="divider">
                    <h4>批次新增 (Excel)</h4>
                    <div class="modal-input-row" style="margin-top:8px;">
                        <input type="file" id="studentExcelFile" accept=".xlsx, .xls" style="flex:1; font-size:13px; color:#4a544d;">
                        <button onclick="uploadStudentExcel()" class="btn-modal-upload">上傳 Excel</button>
                    </div>
                    <p style="font-size:12px; color:#7b857d; margin:6px 0 0;">格式：第一欄為帳號，第二欄為密碼（自動略過標題列）</p>
                </div>
            </div>

            <h4 style="font-size:14px; font-weight:600; color:#2f3a32; margin-bottom:10px;">學生列表</h4>
            <table class="student-table">
                <thead>
                    <tr>
                        <th>帳號</th>
                        <th>建立日期</th>
                    </tr>
                </thead>
                <tbody id="studentListBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 建立班級 Modal -->
    <div id="createClassModal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="width:min(420px,calc(100vw - 40px));">
            <h3>建立新班級</h3>
            <input type="text" id="newClassName" placeholder="請輸入班級名稱（例如：高一數學A班）" class="modal-input" style="margin:4px 0 8px;">
            <div class="modal-actions">
                <button onclick="closeCreateClassModal()" class="btn-modal-cancel">取消</button>
                <button onclick="createClass()" class="btn-modal-ok">建立</button>
            </div>
        </div>
    </div>

    <!-- RAG Settings Modal -->
    <div id="ragSettingsModal" class="modal-overlay" style="display:none; z-index:9999;">
        <div class="modal-box" style="width:min(420px,calc(100vw - 40px));">
            <h3>RAG 參數設定</h3>
            <div style="margin-bottom:14px;">
                <label class="rag-label">Advanced RAG 觸發閾值（預設：0.40）</label>
                <input type="number" step="0.01" id="ragThreshold" class="modal-input" style="margin-bottom:0;">
            </div>
            <div style="margin-bottom:14px;">
                <label class="rag-label">搜索目標與 AI 解答設定</label>
                <label style="display:inline-flex; align-items:center; gap:8px; font-size:13px; color:#4a544d; cursor:pointer;">
                    <input type="checkbox" id="ragEnableAIChat" style="accent-color:#6b8f71;">
                    啟用 AI 助教回答（會消耗 API 額度）
                </label>
            </div>
            <div>
                <label class="rag-label">搜尋結果點擊目標介面</label>
                <select id="ragTargetType" class="modal-input">
                    <option value="practice">基礎練習介面 (/practice/)</option>
                    <option value="adaptive">自適應介面 (/adaptive_practice_v2)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button onclick="closeRagSettingsModal()" class="btn-modal-cancel">取消</button>
                <button onclick="saveRagSettings()" class="btn-modal-ok">儲存</button>
            </div>
        </div>
    </div>

    <script>
        // 頁面載入時獲取班級列表
        document.addEventListener('DOMContentLoaded', loadClasses);

        async function openRagSettingsModal() {
            try {
                const response = await fetch('/api/adaptive/rag_settings');
                const data = await response.json();
                document.getElementById('ragThreshold').value = data.threshold !== undefined ? data.threshold : 0.40;
                document.getElementById('ragTargetType').value = data.target_type || 'practice';
                document.getElementById('ragEnableAIChat').checked = data.enable_ai_chat !== false;
                document.getElementById('ragSettingsModal').style.display = 'flex';
            } catch (e) {
                alert('無法載入設定');
            }
        }

        function closeRagSettingsModal() {
            document.getElementById('ragSettingsModal').style.display = 'none';
        }

        async function saveRagSettings() {
            const threshold = parseFloat(document.getElementById('ragThreshold').value);
            const target_type = document.getElementById('ragTargetType').value;
            const enable_ai_chat = document.getElementById('ragEnableAIChat').checked;
            try {
                const response = await fetch('/admin/rag_settings/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ threshold, target_type, enable_ai_chat })
                });
                const data = await response.json();
                if (data.success) {
                    alert('設定已儲存！');
                    closeRagSettingsModal();
                } else {
                    alert('儲存失敗：' + data.message);
                }
            } catch (error) {
                alert('發生錯誤');
            }
        }

        function openCreateClassModal() {
            document.getElementById('createClassModal').style.display = 'flex';
        }

        function closeCreateClassModal() {
            document.getElementById('createClassModal').style.display = 'none';
            document.getElementById('newClassName').value = '';
        }

        async function loadClasses() {
            try {
                const response = await fetch("{{ url_for('core.get_teacher_classes') }}");
                const data = await response.json();

                if (data.success) {
                    const container = document.getElementById('classList');
                    if (data.classes.length === 0) {
                        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #7f8c8d;">目前還沒有班級，請點擊右上角建立！</p>';
                        return;
                    }

                    container.innerHTML = data.classes.map(cls => `
                        <div class="stat-box" style="text-align: left; position: relative;">
                            <div style="font-size: 1.2em; font-weight: bold; color: #2c3e50;">${cls.name}</div>
                            <div style="margin-top: 10px; color: #7f8c8d; display: flex; align-items: center; gap: 5px;">
                                <span>班級代碼：</span>
                                <span id="code-${cls.id}" style="background-color: #f1c40f; color: #fff; padding: 2px 5px; border-radius: 3px; font-weight: bold;">
                                    ${cls.class_code}
                                </span>
                                <button onclick="copyCode('${cls.class_code}')" title="複製邀請碼" style="background: none; border: none; cursor: pointer; font-size: 1em;">📋</button>
                                <button onclick="regenerateCode(${cls.id})" title="產生新代碼" style="background: none; border: none; cursor: pointer; font-size: 1em;">🔄</button>
                            </div>
                            <div style="margin-top: 5px; color: #7f8c8d;">學生人數：${cls.student_count} 人</div>
                            <div style="margin-top: 15px;">
                                <button onclick="openStudentModal(${cls.id}, '${cls.name}')" style="background-color: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 0.9em;">管理學生</button>
                            </div>
                            <button onclick="deleteClass(${cls.id})" style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: #e74c3c; cursor: pointer;" title="刪除班級">🗑️</button>
                        </div>
                    `).join('');

                    // 更新概覽數據
                    document.querySelector('.stat-number').textContent = data.classes.length;
                }
            } catch (error) {
                console.error('Error loading classes:', error);
            }
        }

        async function createClass() {
            const name = document.getElementById('newClassName').value.trim();
            if (!name) {
                alert('請輸入班級名稱');
                return;
            }

            try {
                const response = await fetch("{{ url_for('core.create_class') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: name })
                });
                const data = await response.json();

                if (data.success) {
                    closeCreateClassModal();
                    loadClasses(); // 重新載入列表
                } else {
                    alert(data.message || '建立失敗');
                }
            } catch (error) {
                console.error('Error creating class:', error);
                alert('發生錯誤，請稍後再試');
            }
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                alert('邀請碼已複製！');
            }).catch(err => {
                console.error('Could not copy text: ', err);
                alert('複製失敗，請手動複製。');
            });
        }

        async function regenerateCode(classId) {
            if (!confirm('確定要產生新的邀請碼嗎？舊的代碼將會失效。')) {
                return;
            }
            try {
                const url = "{{ url_for('core.regenerate_class_code', class_id=0) }}".replace('0', classId);
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                const data = await response.json();
                if (data.success) {
                    const codeSpan = document.getElementById(`code-${classId}`);
                    if (codeSpan) {
                        codeSpan.textContent = data.new_code;
                        // Also update the copy button's onclick handler if necessary, though in this structure it's not needed
                        alert('新的邀請碼已產生！');
                        loadClasses(); // Easiest way to refresh all data including copy button onclick
                    }
                } else {
                    alert(data.message || '產生新碼失敗');
                }
            } catch (error) {
                console.error('Error regenerating code:', error);
                alert('操作失敗，請稍後再試');
            }
        }


        let currentClassId = null;

        function openStudentModal(classId, className) {
            currentClassId = classId;
            document.getElementById('studentModalTitle').textContent = `管理學生 - ${className}`;
            document.getElementById('studentModal').style.display = 'flex';
            loadClassStudents(classId);
        }

        function closeStudentModal() {
            document.getElementById('studentModal').style.display = 'none';
            document.getElementById('newStudentUsername').value = '';
            document.getElementById('newStudentPassword').value = '';
            currentClassId = null;
        }

        async function loadClassStudents(classId) {
            const tbody = document.getElementById('studentListBody');
            tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 20px;">載入中...</td></tr>';

            try {
                const url = "{{ url_for('core.get_class_students', class_id=0) }}".replace('0', classId);
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    if (data.students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 20px; color: #7f8c8d;">目前沒有學生</td></tr>';
                        return;
                    }

                    tbody.innerHTML = data.students.map(s => `
                        <tr style="border-bottom: 1px solid #eee;">
                            <td style="padding: 10px;">${s.username}</td>
                            <td style="padding: 10px;">${s.created_at}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: red;">${data.message}</td></tr>`;
                }
            } catch (error) {
                console.error('Error loading students:', error);
                tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: red;">載入失敗</td></tr>';
            }
        }

        async function addStudent() {
            if (!currentClassId) return;

            const usernameInput = document.getElementById('newStudentUsername');
            const passwordInput = document.getElementById('newStudentPassword');
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                alert('請輸入帳號和密碼');
                return;
            }

            try {
                const url = "{{ url_for('core.add_student_to_class', class_id=0) }}".replace('0', currentClassId);
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    alert('學生新增成功！');
                    usernameInput.value = '';
                    passwordInput.value = '';
                    loadClassStudents(currentClassId); // 重新載入列表
                    loadClasses(); // 更新班級人數
                } else {
                    alert(data.message || '新增失敗');
                }
            } catch (error) {
                console.error('Error adding student:', error);
                alert('發生錯誤，請稍後再試');
            }
        }

        async function uploadStudentExcel() {
            if (!currentClassId) return;

            const fileInput = document.getElementById('studentExcelFile');
            const file = fileInput.files[0];

            if (!file) {
                alert('請選擇 Excel 檔案');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // Show loading state
            const btn = document.querySelector('button[onclick="uploadStudentExcel()"]');
            const originalText = btn ? btn.textContent : '上傳 Excel';
            if (btn) {
                btn.textContent = '處理中...';
                btn.disabled = true;
            }

            try {
                const url = "{{ url_for('core.upload_students_excel', class_id=0) }}".replace('0', currentClassId);

                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    fileInput.value = ''; // Clear input
                    loadClassStudents(currentClassId); // Reload list
                    loadClasses(); // Update counts
                } else {
                    alert(data.message || '上傳失敗');
                }
            } catch (error) {
                console.error('Error uploading Excel:', error);
                alert('發生錯誤，請稍後再試');
            } finally {
                if (btn) {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            }
        }

        async function deleteClass(classId) {
            if (!confirm('確定要刪除這個班級嗎？此動作無法復原！')) return;

            try {
                // 建構刪除 URL
                const deleteUrl = "{{ url_for('core.delete_class', class_id=0) }}".replace('0', classId);

                const response = await fetch(deleteUrl, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    loadClasses(); // 重新載入列表
                } else {
                    alert(data.message || '刪除失敗');
                }
            } catch (error) {
                console.error('Error deleting class:', error);
                alert('發生錯誤，請稍後再試');
            }
        }
    </script>
