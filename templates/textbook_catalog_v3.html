<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建立教材目錄結構 V3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            border: none;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .result-metric {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eef1f5;
        }

        .result-metric:last-child {
            border-bottom: none;
        }

        .result-metric-label {
            color: #5a6578;
            font-size: 0.95rem;
        }

        .result-metric-value {
            font-weight: 600;
            color: #2c3e50;
        }

        .status-success {
            color: #198754;
        }

        .status-error {
            color: #dc3545;
        }

        .conflict-card {
            background: #fff8e6;
            border-left: 4px solid #ffc107;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card p-4 mb-4">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                    style="width: 48px; height: 48px;">
                    <i class="bi bi-journal-bookmark"></i>
                </div>
                <div>
                    <h1 class="h4 mb-1">建立教材目錄結構 V3</h1>
                    <p class="text-muted mb-0">上傳整冊目錄 PDF，由 AI 萃取章節結構並建立/更新 outline。</p>
                </div>
            </div>

            {% if not has_gemini_api_key %}
            <div class="alert alert-warning">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                尚未設定 Gemini API Key。請先至 <a href="{{ ai_settings_url }}">AI 設定</a> 完成設定。
            </div>
            {% endif %}

            <!-- Stage 1: parse form -->
            <form id="catalogForm" method="POST" enctype="multipart/form-data" class="row g-3">
                <input type="hidden" name="action" value="preview">
                <div class="col-md-6">
                    <label class="form-label">目錄 PDF</label>
                    <input class="form-control" type="file" name="catalog_pdf" accept="application/pdf" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">冊別</label>
                    <input class="form-control" type="text" name="volume" value="數學B2" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">年級</label>
                    <input class="form-control" type="number" name="grade" value="10">
                </div>
                <div class="col-md-6">
                    <label class="form-label">課綱</label>
                    <input class="form-control" type="text" name="curriculum" value="vocational" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">解析模式</label>
                    <select class="form-select" name="parse_mode">
                        <option value="v2_text" selected>V2 文字解析（推薦，速度快）</option>
                        <option value="vision">Vision 模型（圖像識別，較慢）</option>
                    </select>
                    <div class="form-text">V2 文字解析直接讀取 PDF 文字層，不需要圖像渲染。</div>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit" id="parseBtn" {% if not has_gemini_api_key %}disabled{% endif %}>
                        <i class="bi bi-search me-2"></i>解析目錄
                    </button>
                    <span class="text-muted small ms-2">解析後可預覽結果，確認後才寫入資料庫。</span>
                </div>
            </form>
        </div>

        <!-- Stage 1 result: preview -->
        <div id="previewPanel" class="card p-4 d-none">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="h5 mb-0">📋 解析預覽（尚未寫入資料庫）</h2>
                <span class="badge bg-warning text-dark">預覽中</span>
            </div>
            <div id="previewSummary"></div>
            <div id="previewChaptersDetail" class="mt-3"></div>
            <div id="previewConflicts" class="mt-3"></div>

            <!-- Stage 2: confirm button (only shown after successful preview) -->
            <div id="confirmSection" class="d-none mt-4 pt-3 border-top">
                <div class="alert alert-info py-2 mb-3">
                    <i class="bi bi-info-circle me-2"></i>
                    以上為預計異動，尚未寫入資料庫。點擊下方確認後才會實際匯入。
                </div>
                <button id="confirmBtn" class="btn btn-success">
                    <i class="bi bi-check2-circle me-2"></i>確認匯入資料庫
                </button>
                <button class="btn btn-outline-secondary ms-2" onclick="document.getElementById('previewPanel').classList.add('d-none')">
                    取消
                </button>
            </div>
        </div>

        <!-- Stage 2 result: confirmed (header filled dynamically by JS) -->
        <div id="confirmedPanel" class="card p-4 d-none">
            <div id="confirmedHeader" class="d-flex align-items-center justify-content-between mb-3"></div>
            <div id="confirmedSummary"></div>
            <div id="confirmedErrors" class="mt-3"></div>
        </div>
    </div>

    <script>
        var _previewToken = null;

        document.getElementById('catalogForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var form = e.target;
            var btn = document.getElementById('parseBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>解析中...';
            document.getElementById('previewPanel').classList.add('d-none');
            document.getElementById('confirmedPanel').classList.add('d-none');
            _previewToken = null;

            fetch('/admin/textbook_catalog_v3', {
                method: 'POST',
                body: new FormData(form),
                credentials: 'same-origin'
            })
                .then(function (response) {
                    var contentType = response.headers.get('content-type') || '';
                    if (!response.ok) {
                        return response.text().then(function (text) {
                            throw new Error('HTTP ' + response.status + ': ' + text.slice(0, 300));
                        });
                    }
                    if (!contentType.includes('application/json')) {
                        return response.text().then(function (text) {
                            throw new Error('伺服器回傳非 JSON：' + text.slice(0, 300));
                        });
                    }
                    return response.json();
                })
                .then(function (data) {
                    renderPreview(data);
                })
                .catch(function (err) {
                    renderPreview({ ok: false, errors: [String(err.message || err)] });
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-search me-2"></i>解析目錄';
                });
        });

        document.getElementById('confirmBtn').addEventListener('click', function () {
            if (!_previewToken) {
                alert('預覽資料已失效，請重新解析目錄。');
                return;
            }
            var btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>寫入中...';

            var fd = new FormData();
            fd.append('action', 'confirm');
            fd.append('preview_token', _previewToken);

            fetch('/admin/textbook_catalog_v3', {
                method: 'POST',
                body: fd,
                credentials: 'same-origin'
            })
                .then(function (response) {
                    var contentType = response.headers.get('content-type') || '';
                    if (!response.ok) {
                        return response.text().then(function (text) {
                            throw new Error('HTTP ' + response.status + ': ' + text.slice(0, 300));
                        });
                    }
                    if (!contentType.includes('application/json')) {
                        return response.text().then(function (text) {
                            throw new Error('伺服器回傳非 JSON：' + text.slice(0, 300));
                        });
                    }
                    return response.json();
                })
                .then(function (data) {
                    renderConfirmed(data);
                })
                .catch(function (err) {
                    renderConfirmed({ ok: false, errors: [String(err.message || err)] });
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check2-circle me-2"></i>確認匯入資料庫';
                });
        });

        function renderPreview(data) {
            var panel = document.getElementById('previewPanel');
            var summary = document.getElementById('previewSummary');
            var detail = document.getElementById('previewChaptersDetail');
            var conflictsDiv = document.getElementById('previewConflicts');
            var confirmSection = document.getElementById('confirmSection');
            panel.classList.remove('d-none');

            var statusClass = data.ok ? 'status-success' : 'status-error';
            var statusText = data.ok ? '解析成功' : '需要審核';

            var html = '<div class="result-metric"><span class="result-metric-label">狀態</span>' +
                '<span class="result-metric-value ' + statusClass + '">' + statusText + '</span></div>';

            var metrics = [
                ['chapters_created', '預計新建章數'],
                ['chapters_updated', '預計更新章數'],
                ['sections_created', '預計新建節數'],
                ['sections_reused', '預計沿用節數'],
                ['sections_updated', '預計更新節數'],
                ['conflicts', '衝突數'],
                ['needs_review', '待審核']
            ];
            metrics.forEach(function (m) {
                var value = data[m[0]];
                if (Array.isArray(value)) value = value.length;
                html += '<div class="result-metric"><span class="result-metric-label">' + m[1] +
                    '</span><span class="result-metric-value">' + (value || 0) + '</span></div>';
            });
            summary.innerHTML = html;

            // chapters detail
            var dHtml = '';
            if (data.preview_chapters && data.preview_chapters.length) {
                dHtml += '<h3 class="h6 mt-3 mb-2">章節預覽</h3>';
                data.preview_chapters.forEach(function (ch) {
                    dHtml += '<div class="mb-2"><strong>第' + ch.chapter_index + '章 ' +
                        esc(ch.chapter_title) + '</strong>';
                    if (ch.sections && ch.sections.length) {
                        dHtml += '<ul class="mb-1 mt-1 small text-secondary">';
                        ch.sections.forEach(function (s) {
                            dHtml += '<li>' + esc(s.section_code) + ' ' + esc(s.section_title) +
                                (s.page ? '（頁 ' + s.page + '）' : '') + '</li>';
                        });
                        dHtml += '</ul>';
                    }
                    dHtml += '</div>';
                });
            }
            detail.innerHTML = dHtml;

            // conflicts
            conflictsDiv.innerHTML = '';
            if (data.conflicts && data.conflicts.length) {
                var cHtml = '<h3 class="h6 mt-3">衝突項目</h3>';
                data.conflicts.forEach(function (c) {
                    cHtml += '<div class="conflict-card"><strong>' + esc(c.section_code) + '</strong> ' +
                        '<span class="text-muted">（章 ' + c.chapter_index + '）</span>' +
                        '<div class="small mt-1">匯入：' + esc(c.incoming_section) + '</div>' +
                        '<div class="small text-danger">既有：' + (c.existing_sections || []).map(function (e) {
                            return esc(e.section);
                        }).join('； ') + '</div></div>';
                });
                conflictsDiv.innerHTML = cHtml;
            }
            if (data.errors && data.errors.length) {
                var eHtml = '<h3 class="h6 mt-3">錯誤</h3>';
                data.errors.forEach(function (err) {
                    eHtml += '<div class="alert alert-danger py-2">' + esc(err) + '</div>';
                });
                conflictsDiv.innerHTML += eHtml;
            }

            // show confirm button only when token present
            if (data.preview_token) {
                _previewToken = data.preview_token;
                confirmSection.classList.remove('d-none');
            } else {
                _previewToken = null;
                confirmSection.classList.add('d-none');
            }
        }

        function renderConfirmed(data) {
            document.getElementById('previewPanel').classList.add('d-none');
            var panel = document.getElementById('confirmedPanel');
            var header = document.getElementById('confirmedHeader');
            var summary = document.getElementById('confirmedSummary');
            var errorsDiv = document.getElementById('confirmedErrors');
            panel.classList.remove('d-none');

            if (data.ok) {
                header.innerHTML =
                    '<h2 class="h5 mb-0">✅ 匯入完成</h2>' +
                    '<span class="badge bg-success">已寫入資料庫</span>';
            } else {
                header.innerHTML =
                    '<h2 class="h5 mb-0 text-danger">❌ 匯入失敗</h2>' +
                    '<span class="badge bg-danger">未寫入資料庫</span>';
            }

            var html = '';
            if (data.ok) {
                var metrics = [
                    ['chapters_created', '已新建章數'],
                    ['chapters_updated', '已更新章數'],
                    ['sections_created', '已新建節數'],
                    ['sections_reused', '已沿用節數'],
                    ['sections_updated', '已更新節數'],
                    ['conflicts', '衝突數'],
                ];
                metrics.forEach(function (m) {
                    var value = data[m[0]];
                    if (Array.isArray(value)) value = value.length;
                    html += '<div class="result-metric"><span class="result-metric-label">' + m[1] +
                        '</span><span class="result-metric-value">' + (value || 0) + '</span></div>';
                });
            }
            summary.innerHTML = html;

            errorsDiv.innerHTML = '';
            if (!data.ok) {
                var msg = data.message || (data.errors && data.errors[0]) || '未知錯誤';
                errorsDiv.innerHTML = '<div class="alert alert-danger py-2">' + esc(msg) + '</div>';
            } else if (data.errors && data.errors.length) {
                var eHtml = '<h3 class="h6 mt-3">錯誤</h3>';
                data.errors.forEach(function (err) {
                    eHtml += '<div class="alert alert-danger py-2">' + esc(err) + '</div>';
                });
                errorsDiv.innerHTML = eHtml;
            }
        }

        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>

</html>
