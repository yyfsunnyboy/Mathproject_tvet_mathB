{#
  Shared MathJax v3 renderer for trusted, server-rendered skill-card metadata.
  Text remains Jinja-escaped; MathJax reads text nodes only and no card content
  is inserted through unsafe HTML assignment.
#}
<style>
    .skill-card-description { min-width: 0; overflow-wrap: anywhere; }
    .skill-card-description mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
</style>
<script>
    (function () {
        "use strict";

        window.MathJax = window.MathJax || {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' }
        };

        var renderQueue = Promise.resolve();
        var rendered = new WeakSet();
        var delimiterPattern = /\$|\\\(|\\\[|\\frac|\\sqrt|\\(?:sin|cos|tan|theta|text)\b/;
        var delimitedMath = /(\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\$[^$\n]*\$)/g;

        // Format only equation-shaped ASCII runs outside existing TeX delimiters.
        // Chinese prose and already delimited formulas remain untouched.
        function formatBareEquations(text) {
            return text.replace(/[A-Za-z0-9()[\]{}^_+*/=<>.,√πθ≤≥≠∞×\s-]+/g, function (run) {
                var match = run.match(/^(\s*)([A-Za-z0-9()[\]{}^_+*/=<>.,√πθ≤≥≠∞×\s-]*[A-Za-z0-9)\]}])(\s*)$/);
                if (!match) return run;
                var formula = match[2].trim();
                var words = formula.replace(/\b(?:sqrt|sin|cos|tan|log|ln|exp|rad)\b/gi, '');
                if (!/[\^_+*/=<>√≤≥≠∞]/.test(formula)
                    || (!/[=<>≤≥≠]/.test(formula) && !/[\^_√]/.test(formula))
                    || /[A-Za-z]{3,}/.test(words) || formula.length > 240) return run;
                return match[1] + '\\(' + formula + '\\)' + match[3];
            });
        }

        function formatDescription(text) {
            var output = '';
            var last = 0;
            delimitedMath.lastIndex = 0;
            var match;
            while ((match = delimitedMath.exec(text)) !== null) {
                output += formatBareEquations(text.slice(last, match.index)) + match[0];
                last = match.index + match[0].length;
            }
            return output + formatBareEquations(text.slice(last));
        }

        function hasMathSource(element) {
            return Boolean(element && delimiterPattern.test(element.textContent || ''));
        }

        function typesetSkillCardDescriptions(elements) {
            var targets = Array.from(new Set(elements || []))
                .filter(function (element) {
                    if (!element.isConnected || rendered.has(element)) return false;
                    var original = element.textContent || '';
                    var formatted = formatDescription(original);
                    if (formatted !== original) element.textContent = formatted;
                    return hasMathSource(element);
                });
            if (!targets.length || !window.MathJax || !window.MathJax.startup) return;
            targets.forEach(function (element) { rendered.add(element); });

            renderQueue = renderQueue.then(function () {
                return window.MathJax.startup.promise.then(function () {
                    targets = targets.filter(function (element) { return element.isConnected; });
                    if (targets.length) return window.MathJax.typesetPromise(targets);
                });
            }).catch(function (error) {
                targets.forEach(function (element) { rendered.delete(element); });
                console.warn('Skill-card MathJax render error:', error);
            });
        }

        function skillCardDescriptions(root) {
            if (!root) return [];
            var descriptions = [];
            if (root.nodeType === Node.ELEMENT_NODE && root.matches('.skill-card-description')) {
                descriptions.push(root);
            }
            if (root.querySelectorAll) {
                descriptions = descriptions.concat(
                    Array.from(root.querySelectorAll('.skill-card-description'))
                );
            }
            return descriptions;
        }

        function loadAndRenderInitialCards() {
            var initial = skillCardDescriptions(document);
            if (!initial.length) return;

            if (window.MathJax && window.MathJax.typesetPromise) {
                typesetSkillCardDescriptions(initial);
                return;
            }
            if (document.querySelector("script[data-skill-card-mathjax-loader='1']")) return;

            var script = document.createElement('script');
            script.id = 'mathjax-skill-card-loader';
            script.defer = true;
            script.setAttribute('data-skill-card-mathjax-loader', '1');
            script.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js';
            script.onload = function () { typesetSkillCardDescriptions(skillCardDescriptions(document)); };
            document.head.appendChild(script);
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadAndRenderInitialCards();
            if (typeof MutationObserver === 'undefined') return;

            new MutationObserver(function (records) {
                var added = [];
                records.forEach(function (record) {
                    Array.from(record.addedNodes).forEach(function (node) {
                        if (node.nodeType !== Node.ELEMENT_NODE || node.matches('mjx-container')) return;
                        added = added.concat(skillCardDescriptions(node));
                    });
                });
                typesetSkillCardDescriptions(added);
            }).observe(document.body, { childList: true, subtree: true });
        });
    })();
</script>
