<!--
=============================================================================
模組名稱 (Module Name): templates/demo_teacher_overview.html
功能說明 (Description): 公開 Demo 模式 - 教師總覽唯讀假資料儀表板
後端呼叫 (Backend Call): core/routes/demo.py -> teacher_overview
=============================================================================
-->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>教師總覽展示 - 公開展示模式</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f7f6f2;
            color: #2f3a32;
            padding: 40px 20px;
        }
        .wrap { max-width: 820px; margin: 0 auto; }
        .banner {
            background: #fff4df;
            color: #8a5a1f;
            border: 1px solid #f0d9a8;
            border-radius: 10px;
            padding: 14px 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        h1 { margin-bottom: 20px; }
        h2 { font-size: 16px; margin: 24px 0 10px; color: #4a544d; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #dde5d8; }
        th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #edf1e8; font-size: 14px; }
        th { background: #f6f1e8; color: #4a544d; }
        tr:last-child td { border-bottom: none; }
        a.back { display: inline-block; margin-top: 24px; color: #55735c; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="banner">{{ banner }}</div>
        <h1>教師總覽展示（唯讀假資料）</h1>

        <h2>示範學生學習狀況</h2>
        <table>
            <thead>
                <tr><th>學生（示範）</th><th>精熟度</th><th>已完成題數</th></tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.display_name }}</td>
                    <td>{{ s.mastery }}%</td>
                    <td>{{ s.completed }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <h2>示範錯題排行</h2>
        <table>
            <thead>
                <tr><th>題目（示範）</th><th>錯誤次數</th></tr>
            </thead>
            <tbody>
                {% for m in mistakes %}
                <tr>
                    <td>{{ m.question }}</td>
                    <td>{{ m.count }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a class="back" href="{{ url_for('demo.index') }}">← 回到展示首頁</a>
    </div>
</body>
</html>
